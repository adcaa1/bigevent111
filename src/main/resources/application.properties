spring.application.name=bigevent
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/big_event
spring.datasource.username=root
spring.datasource.password=040926
spring.data.redis.host=localhost
spring.data.redis.port=6379
# MyBatis配置
mybatis.type-aliases-package=com.example.bigevent.domain
#上传文件大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# 开启SQL日志（可选，用于调试）
logging.level.com.example.bigevent.mapper=DEBUG
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# OpenAI 配置
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=qwen3.6-flash
langchain4j.open-ai.chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
langchain4j.open-ai.chat-model.timeout=30s
#流式输出
langchain4j.open-ai.streaming-chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.streaming-chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.streaming-chat-model.model-name=qwen3.6-flash
langchain4j.open-ai.streaming-chat-model.log-requests=true
langchain4j.open-ai.streaming-chat-model.log-responses=true
# 2. 配置用于 Embedding 的模型
langchain4j.open-ai.embedding-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.embedding-model.model-name=text-embedding-v2
langchain4j.open-ai.embedding-model.log-requests=true
langchain4j.open-ai.embedding-model.log-responses=true
# 设置最大批次大小为25，避免超过阿里云API限制
langchain4j.open-ai.embedding-model.max-segments-per-batch=25
#向量数据库的配置
langchain4j.community.redis.host=localhost
langchain4j.community.redis.port=6379
# RabbitMQ配置
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# RabbitMQ 消费者重试：最多重试3次，之后消息进入死信/丢弃
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Elasticsearch 配置
# 本地开发默认无认证；生产环境建议启用 HTTPS + 用户名密码
elasticsearch.host=localhost
elasticsearch.port=9200
elasticsearch.scheme=http
elasticsearch.username=
elasticsearch.password=

# RAG 文件上传存储路径
rag.document.upload-path=D:/ideaproject/bigevent/KnowledgeBase

# RAG 混合检索配置
rag.search.vector-top-k=10
rag.search.keyword-top-k=10
rag.search.vector-weight=1.0
rag.search.keyword-weight=0.7
rag.search.rrf-k=60
rag.search.min-score=0.2

# AI 长期语义记忆召回配置
ai.history.top-k=5
ai.history.min-score=0.6
ai.history.max-age-days=30
# 召回策略：same_session(仅当前会话) / cross_session(跨会话) / with_decay(跨会话+时间衰减)
ai.history.recall-strategy=cross_session